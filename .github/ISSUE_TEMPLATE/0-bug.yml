name: Bug report
description: Report a bug with the project
title: '[Bug] <title>'
labels: [bug]
projects: ['@Kjur0/3']
body:
  - type: markdown
    attributes:
      value: |
        If you have found a bug, please provide as much information as possible to help us reproduce
  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: Please provide a detailed description of the bug you have found
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Please provide a step-by-step guide on how to reproduce the bug
      value: |
        1. Step one
        2. Step two
        3. Step three
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: Please describe what you expected to happen when you encountered the bug.
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: Please describe what actually happened when you encountered the bug.
    validations:
      required: true
  - type: input
    id: bun-version
    attributes:
      label: Bun version
      description: '`bun -v`'
    validations:
      required: true
  - type: input
    id: logger-version
    attributes:
      label: logger version
      description: '`bun list bun-logger`'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Please provide information about your environmental variables (Logger configuration)
